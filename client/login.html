<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Login - ShopSphere</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <header>

        <div class="logo">
            <h2>🛍️ ShopSphere</h2>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>

    </header>

    <section class="login-section">

        <div class="login-box">
            <h2>Login to ShopSphere</h2>
            <form id="loginForm">

                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>

                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember Me</label>
                </div>

                <button type="submit">Login</button>

                <p class="register-link">Don't have an account? 
                    <a href="register.html">Register here</a></p>

            </form>

        </div>

    </section>

    <footer>

        <h2>ShopSphere</h2>

        <p>Your One Stop Shopping Destination.</p>

        <p>Email: shopsphere@gmail.com</p>

        <p>Phone: +91 9898555789</p>

        <p>&copy; 2026 ShopSphere. All rights reserved.</p>

    </footer>
    

    <script src="script.js"></script>

</body>
</html>
