<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopSphere - Edit Product</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background: #f5f5f5;
            margin: 0;
        }

        .admin-header {
            background: #2874f0;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            margin: 0;
        }

        .back-btn {
            background: white;
            color: #2874f0;
            border: none;
            padding: 9px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .edit-container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .edit-container h2 {
            margin-top: 0;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .update-btn {
            width: 100%;
            background: #2874f0;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .update-btn:hover {
            background: #1765d1;
        }

    </style>

</head>


<body>

<header class="admin-header">

    <h1>🛍️ ShopSphere Admin</h1>

    <button
        class="back-btn"
        onclick="location.href='admin-products.html'"
    >
        ← Products
    </button>

</header>


<main class="edit-container">

    <h2>✏️ Edit Product</h2>

    <form id="editProductForm">

        <div class="form-group">

            <label>Product Name</label>

            <input
                type="text"
                id="productName"
                required
            >

        </div>


        <div class="form-group">

            <label>Category</label>

            <input
                type="text"
                id="productCategory"
                required
            >

        </div>


        <div class="form-group">

            <label>Product Image URL</label>

            <input
                type="text"
                id="productImage"
                required
            >

        </div>


        <div class="form-group">

            <label>Price</label>

            <input
                type="number"
                id="productPrice"
                required
            >

        </div>


        <div class="form-group">

            <label>MRP</label>

            <input
                type="number"
                id="productMrp"
            >

        </div>


        <div class="form-group">

            <label>Discount</label>

            <input
                type="text"
                id="productDiscount"
                placeholder="Example: 20% OFF"
            >

        </div>


        <div class="form-group">

            <label>Rating</label>

            <input
                type="number"
                id="productRating"
                min="0"
                max="5"
                step="0.1"
            >

        </div>


        <div class="form-group">

            <label>Stock</label>

            <input
                type="number"
                id="productStock"
                min="0"
                required
            >

        </div>


        <div class="form-group">

            <label>Description</label>

            <textarea id="productDescription"></textarea>

        </div>


        <button
            type="submit"
            class="update-btn"
        >
            💾 Update Product
        </button>

    </form>

</main>


<script>

const adminToken =
    localStorage.getItem("shopSphereAdminToken");


if (!adminToken) {

    window.location.href = "admin-login.html";

}


/* ================= GET SELECTED PRODUCT ================= */

const storedProduct =
    localStorage.getItem("shopSphereEditProduct");


if (!storedProduct) {

    alert("No product selected ❌");

    window.location.href =
        "admin-products.html";

}


const product =
    JSON.parse(storedProduct);


/* ================= FILL FORM ================= */

document.getElementById("productName").value =
    product.name || "";

document.getElementById("productCategory").value =
    product.category || "";

document.getElementById("productImage").value =
    product.image || "";

document.getElementById("productPrice").value =
    product.price || "";

document.getElementById("productMrp").value =
    product.mrp || "";

document.getElementById("productDiscount").value =
    product.discount || "";

document.getElementById("productRating").value =
    product.rating || "";

document.getElementById("productStock").value =
    product.stock || 0;

document.getElementById("productDescription").value =
    product.description || "";


/* ================= UPDATE PRODUCT ================= */

document
    .getElementById("editProductForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const updatedProduct = {

            name:
                document.getElementById("productName").value,

            category:
                document.getElementById("productCategory").value,

            image:
                document.getElementById("productImage").value,

            price:
                Number(document.getElementById("productPrice").value),

            mrp:
                Number(document.getElementById("productMrp").value),

            discount:
                document.getElementById("productDiscount").value,

            rating:
                Number(document.getElementById("productRating").value),

            stock:
                Number(document.getElementById("productStock").value),

            description:
                document.getElementById("productDescription").value

        };


        try {

            const response =
                await fetch(
                    "http://localhost:5000/api/products/" +
                    product._id,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body:
                            JSON.stringify(updatedProduct)
                    }
                );


            const data =
                await response.json();


            if (response.ok) {

                alert(
                    "Product updated successfully ✅"
                );


                localStorage.removeItem(
                    "shopSphereEditProduct"
                );


                window.location.href =
                    "admin-products.html";

            }

            else {

                alert(
                    data.message ||
                    "Failed to update product ❌"
                );

            }

        }

        catch (error) {

            console.log(
                "Update product error:",
                error
            );

            alert(
                "Server connection failed ❌"
            );

        }

    });

</script>


</body>

</html>
