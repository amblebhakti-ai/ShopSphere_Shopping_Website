<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ShopSphere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

    <div class="logo">
        <h2>🛍️ ShopSphere</h2>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

</header>

<section class="login-section">

    <div class="login-box">

        <h2>Create Your Account</h2>

        <form id="registerForm">

            <label>Full Name</label>
            <input type="text" id="registerName" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" id="registerEmail" placeholder="Enter your email" required>

            <label>Mobile Number</label>
            <input type="tel" id="registerMobile" placeholder="Enter your mobile number" required>

            <label>Password</label>
            <input type="password" id="registerPassword" placeholder="Create password" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

            <button type="submit">Create Account</button>

            <p class="register-link">Already have an account?
                <a href="login.html">Login Here</a>
            </p>

        </form>

    </div>

</section>

<footer>

    <h2>ShopSphere</h2>

        <p>Your One Stop Shopping Destination.</p>

        <p>Email: shopsphere@gmail.com</p>

        <p>Phone: +91 9923728199</p>

        <p>&copy; 2026 ShopSphere. All rights reserved.</p>

</footer>

<script src="script.js"></script>

</body>
</html>
