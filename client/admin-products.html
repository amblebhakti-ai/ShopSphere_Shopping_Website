<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopSphere - Product Management</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background: #f5f5f5;
            margin: 0;
        }

        .admin-header {
            background: #2874f0;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            margin: 0;
        }

        .back-btn {
            background: white;
            color: #2874f0;
            border: none;
            padding: 9px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .admin-container {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .top-bar input {
            padding: 12px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .add-btn {
            background: #2874f0;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .products-table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .products-table th,
        .products-table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        .products-table th {
            background: #2874f0;
            color: white;
        }

        .product-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .edit-btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            background: white;
        }

        @media (max-width: 800px) {

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .top-bar input {
                width: auto;
            }

            .products-table {
                display: block;
                overflow-x: auto;
            }

        }

    </style>

</head>


<body>


<header class="admin-header">

    <h1>🛍️ ShopSphere Admin</h1>

    <button
        class="back-btn"
        onclick="location.href='admin-dashboard.html'"
    >
        ← Dashboard
    </button>

</header>



<main class="admin-container">


    <div class="top-bar">

        <h2>📦 Product Management</h2>

        <div>

            <input
                type="text"
                id="searchProduct"
                placeholder="Search products..."
            >

            <button
                class="add-btn"
                onclick="addProduct()"
            >
                ➕ Add Product
            </button>

        </div>

    </div>



    <table class="products-table">


        <thead>

            <tr>

                <th>Image</th>

                <th>Name</th>

                <th>Category</th>

                <th>Price</th>

                <th>Stock</th>

                <th>Actions</th>

            </tr>

        </thead>


        <tbody id="productTableBody"></tbody>


    </table>


</main>



<script>


/* ================= ADMIN LOGIN CHECK ================= */

const adminToken =
    localStorage.getItem("shopSphereAdminToken");


if (!adminToken) {

    window.location.href =
        "admin-login.html";

}



let allProducts = [];



/* ================= LOAD PRODUCTS ================= */

async function loadProducts() {

    try {

        const response =
            await fetch(
                "https://shopsphere-shopping-website.onrender.com/api/products"
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load products"
            );

        }


        allProducts =
            await response.json();


        displayProducts(
            allProducts
        );


    }

    catch (error) {

        console.log(
            "Product loading error:",
            error
        );


        document.getElementById(
            "productTableBody"
        ).innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty-message"
                >
                    Failed to load products ❌
                </td>

            </tr>

        `;

    }

}



/* ================= DISPLAY PRODUCTS ================= */

function displayProducts(products) {


    const tableBody =
        document.getElementById(
            "productTableBody"
        );


    tableBody.innerHTML = "";


    if (products.length === 0) {

        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty-message"
                >
                    No products found
                </td>

            </tr>

        `;

        return;

    }



    products.forEach(function (product) {


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>

                <img
                    src="${product.image}"
                    class="product-img"
                    alt="${product.name}"
                >

            </td>


            <td>
                ${product.name}
            </td>


            <td>
                ${product.category}
            </td>


            <td>

                ₹${Number(product.price)
                    .toLocaleString("en-IN")}

            </td>


            <td>
                ${product.stock}
            </td>


            <td>


                <button
                    class="edit-btn"
                    onclick="editProduct('${product._id}')"
                >
                    ✏️ Edit
                </button>


                <button
                    class="delete-btn"
                    onclick="deleteProduct('${product._id}')"
                >
                    🗑️ Delete
                </button>


            </td>

        `;


        tableBody.appendChild(row);


    });

}



/* ================= SEARCH PRODUCTS ================= */

document
    .getElementById("searchProduct")
    .addEventListener(
        "input",
        function () {


            const searchText =
                this.value
                    .toLowerCase();


            const filteredProducts =
                allProducts.filter(
                    function (product) {


                        return (

                            product.name
                                .toLowerCase()
                                .includes(searchText)

                            ||

                            product.category
                                .toLowerCase()
                                .includes(searchText)

                        );

                    }
                );


            displayProducts(
                filteredProducts
            );


        }
    );



/* ================= ADD PRODUCT ================= */

function addProduct() {

    window.location.href =
        "admin-add-product.html";

}



/* ================= EDIT PRODUCT ================= */

function editProduct(productId) {

    const product = allProducts.find(function (p) {
        return p._id === productId;
    });

    if (!product) {
        alert("Product not found ❌");
        return;
    }

    localStorage.setItem(
        "shopSphereEditProduct",
        JSON.stringify(product)
    );

    window.location.href = "admin-edit-product.html";
}



/* ================= DELETE PRODUCT ================= */

async function deleteProduct(productId) {


    const product =
        allProducts.find(
            function (p) {

                return p._id === productId;

            }
        );


    if (!product) {

        alert(
            "Product not found ❌"
        );

        return;

    }



    /* Confirmation */

    const confirmDelete =
        confirm(
            "Are you sure you want to delete \"" +
            product.name +
            "\"?"
        );


    if (!confirmDelete) {

        return;

    }



    try {


        const response =
            await fetch(
                "https://shopsphere-shopping-website.onrender.com/api/products/" +
                productId,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (response.ok) {


            alert(
                "Product deleted successfully ✅"
            );


            /* Remove from local array */

            allProducts =
                allProducts.filter(
                    function (p) {

                        return p._id !== productId;

                    }
                );


            /* Refresh table */

            displayProducts(
                allProducts
            );


        }

        else {


            alert(
                data.message ||
                "Failed to delete product ❌"
            );

        }


    }

    catch (error) {


        console.log(
            "Delete product error:",
            error
        );


        alert(
            "Server connection failed ❌"
        );

    }

}



/* ================= START ================= */

loadProducts();


</script>


</body>

</html>
